<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Corridors - Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="vignette"></div>
    <div class="scan-line"></div>
    
    <div id="game-wrapper">
        <div id="scene-container"></div>

        <div id="title-screen" class="absolute inset-0 z-[80] flex flex-col justify-center pl-16 text-green-500">
            <h1 class="text-7xl font-bold mb-16 tracking-tighter text-shadow border-l-8 border-green-500 pl-6 glitch-text pointer-events-none text-left">
                THE CORRIDORS
            </h1>
            <div class="flex flex-col gap-6 items-start w-96 pl-8 mt-32">
                <button id="start-btn" onclick="startNight1()" onmouseenter="playSound('select')" class="menu-btn w-full text-2xl tracking-wider">NIGHT 1</button>
                <button onclick="showCustomNight()" onmouseenter="playSound('select')" class="menu-btn w-full text-2xl tracking-wider">CUSTOM NIGHT</button>
            </div>
            <div class="absolute bottom-4 left-16 text-xs opacity-50 font-sans pointer-events-none tracking-widest text-left">
                VER 8.4 (LOGIC FIX) <br> © 2026 CORRIDOR SECURITY SYSTEMS
            </div>
        </div>

        <div id="custom-night-menu" class="hidden absolute inset-0 bg-black/90 z-[70] flex flex-col items-center justify-center text-green-500">
            <h2 class="text-4xl font-bold mb-8 text-yellow-500">CUSTOM NIGHT SETUP</h2>
            <div class="bg-gray-900 border border-yellow-600 p-8 rounded-lg w-96 text-center shadow-[0_0_20px_rgba(255,200,0,0.2)]">
                <label class="block mb-4 text-lg text-yellow-500">AI AGGRESSION LEVEL</label>
                <div class="flex items-center justify-between mb-4 text-yellow-200">
                    <span>1</span>
                    <span id="diff-val" class="text-3xl font-bold text-white">5</span>
                    <span>20</span>
                </div>
                <input type="range" id="difficulty-slider" min="1" max="20" value="5" class="w-full mb-8 h-2 bg-yellow-900 rounded-lg appearance-none cursor-pointer">
                <div class="flex gap-4">
                    <button onclick="backToTitle()" onmouseenter="playSound('select')" class="action-btn flex-1 text-center border-gray-500 text-gray-400 hover:bg-gray-700 hover:text-white">BACK</button>
                    <button onclick="startGameFromCustom()" onmouseenter="playSound('select')" class="action-btn flex-1 text-center font-bold border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black">START</button>
                </div>
            </div>
        </div>

        <div id="ui-layer" class="hidden absolute inset-0 pointer-events-none z-10 p-4">
            <div class="flex justify-between items-start pointer-events-auto">
                <div class="flex flex-col items-start ml-2 mt-2">
                    <div class="text-white font-bold font-mono tracking-widest text-lg mb-1" style="text-shadow: 0 0 5px white;">ENERGY</div>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="battery-icon">
                            <div id="energy-bar" class="battery-level" style="width: 100%;"></div>
                        </div>
                        <span id="energy-text" class="text-xs font-mono text-white">100%</span>
                    </div>
                    <div class="text-gray-400 font-bold font-mono tracking-widest text-xs">USAGE</div>
                    <div class="usage-container" id="usage-meter">
                        <div class="usage-block active-green" id="usage-1"></div> 
                        <div class="usage-block" id="usage-2"></div>
                        <div class="usage-block" id="usage-3"></div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="bg-black/80 border border-green-800 p-2 rounded text-center min-w-[120px]">
                        <div id="clock-display" class="text-3xl font-bold text-white font-mono leading-none mb-1">12 AM</div>
                        <div id="timer-small" class="text-[10px] text-green-400 opacity-50 font-mono tracking-widest">00:00:00</div>
                    </div>
                    <button onclick="returnToMenu()" class="mt-1 text-[10px] text-red-500 hover:text-red-300 uppercase tracking-wide border border-red-900 bg-black/50 px-3 py-0.5 hover:bg-red-900/50 transition-colors pointer-events-auto">
                        MENU
                    </button>
                </div>
            </div>

            <div id="door-panel" class="absolute bottom-4 left-4 pointer-events-auto">
                <div class="bg-black/70 p-3 border border-green-900 rounded-lg backdrop-blur-sm">
                    <button id="door-btn" onclick="toggleDoor()" class="action-btn w-40 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-lg border-2 border-gray-600 shadow-lg active:scale-95 transition-all duration-100">
                        DOOR
                    </button>
                </div>
            </div>

            <button id="cctv-trigger" onclick="toggleTablet()" class="pointer-events-auto bg-black/90 border-l-4 border-green-500 text-green-500 p-4 rounded-l-md hover:bg-green-900 transition-all flex items-center gap-2 group w-48 shadow-lg">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse" id="cctv-led"></div>
                <span class="font-bold tracking-widest text-sm" id="cctv-text">OPEN CCTV</span>
            </button>

            <div id="tablet-container" class="pointer-events-auto">
                <div class="monitor-frame">
                    <div class="monitor-screen p-4">
                        <div id="static-effect" class="static-overlay"></div>
                        <div class="flex justify-between items-center mb-2 border-b border-green-900/50 pb-2 relative z-30">
                            <span class="text-xs text-green-500">CAM-OS V.3.0</span>
                        </div>

                        <div class="relative w-full h-4/5 border border-green-900/30 bg-black/50 z-30 overflow-hidden">
                            <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-60" style="z-index: 0;">
                                <line x1="50%" y1="10%" x2="50%" y2="35%" stroke="#0f0" stroke-width="2" />
                                <line x1="50%" y1="35%" x2="15%" y2="35%" stroke="#0f0" stroke-width="2" />
                                <line x1="15%" y1="35%" x2="15%" y2="60%" stroke="#0f0" stroke-width="2" />
                                <line x1="15%" y1="60%" x2="50%" y2="60%" stroke="#0f0" stroke-width="2" />
                                <line x1="50%" y1="60%" x2="50%" y2="80%" stroke="#0f0" stroke-width="2" />
                                <line x1="15%" y1="62%" x2="15%" y2="82%" stroke="#0f0" stroke-width="4" stroke-dasharray="4" />
                                <line x1="15%" y1="82%" x2="40%" y2="82%" stroke="#0f0" stroke-width="4" stroke-dasharray="4" />
                                <text x="18%" y="75%" fill="#0f0" font-size="8" font-weight="bold" font-family="monospace">VENT PATH</text>
                            </svg>

                            <div id="node-0" class="node w-12 h-8 rounded-sm border border-green-500 bg-black absolute top-[5%] left-1/2 transform -translate-x-1/2 flex items-center justify-center text-[8px] font-bold text-green-500">CAM 01</div>
                            <div id="node-1" class="node w-12 h-8 rounded-sm border border-green-500 bg-black absolute top-[30%] left-1/2 transform -translate-x-1/2 flex items-center justify-center text-[8px] font-bold text-green-500">CAM 02</div>
                            <div id="node-2" class="node w-12 h-8 rounded-sm border border-green-500 bg-black absolute top-[30%] left-[10%] flex items-center justify-center text-[8px] font-bold text-green-500">CAM 03</div>
                            <div id="node-3" class="node w-12 h-8 rounded-sm border border-green-500 bg-black absolute top-[55%] left-[10%] flex items-center justify-center text-[8px] font-bold text-green-500">CAM 04</div>
                            <div id="node-4" class="node w-12 h-8 rounded-sm border border-green-500 bg-black absolute top-[55%] left-1/2 transform -translate-x-1/2 flex items-center justify-center text-[8px] font-bold text-green-500">CAM 05</div>

                            <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-24 h-12 border-2 border-green-700 bg-green-900/20 flex flex-col items-center justify-center z-10">
                                <div class="player-arrow mb-1"></div>
                                <span class="text-[8px] text-green-500 font-bold tracking-widest">OFFICE</span>
                            </div>
                        </div>
                        <div class="absolute bottom-2 left-4 text-xs text-green-700 animate-pulse relative z-30">LIVE SIGNAL...</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-over-screen" class="hidden absolute inset-0 bg-black z-[70] flex flex-col items-center justify-center">
            <h1 class="text-7xl font-bold text-red-600 mb-8 tracking-widest font-mono">YOU DIED</h1>
            <div class="flex flex-col gap-4 w-64">
                <button onclick="restartGame()" class="action-btn text-center text-white border-white hover:bg-white hover:text-black">TRY AGAIN</button>
                <button onclick="returnToMenu()" class="action-btn text-center text-gray-400 border-gray-600 hover:bg-gray-800 hover:text-white">RETURN TO MENU</button>
            </div>
        </div>

        <div id="win-screen" class="hidden absolute inset-0 bg-green-950 z-[70] flex flex-col items-center justify-center text-white">
            <h1 class="text-6xl font-bold mb-4 text-green-300">SURVIVED</h1>
            <p class="text-xl mb-8 font-mono">06:00 AM</p>
            <div class="flex flex-col gap-4 w-64">
                <button onclick="returnToMenu()" class="action-btn text-center text-green-300 border-green-500 hover:bg-green-500 hover:text-black">MAIN MENU</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
